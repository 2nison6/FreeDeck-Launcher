plugins {
    id 'com.android.application'
}

// Release signing: the keystore and its passwords stay out of the repository. Gradle reads them from
// keystore.properties in the project root, or from ~/FreeDeck-signing/keystore.properties. See README, "Build from source".
def signingProps = new Properties()
[rootProject.file('keystore.properties'),
 new File(System.getProperty('user.home'), 'FreeDeck-signing/keystore.properties')].find { it.exists() }?.withInputStream {
    signingProps.load(it)
}

android {
    namespace = 'com.nison.freedeck'
    compileSdk = 35

    sourceSets {
        main {
            res.srcDirs = ['src/main/res']
        }
    }

    defaultConfig {
        // Overridable with -PlauncherApplicationId=... for firmware that only allows a fixed package name.
        applicationId = providers.gradleProperty('launcherApplicationId').getOrElse('com.nison.freedeck')
        minSdk = 26
        targetSdk = 34
        versionCode = 1
        versionName = '1.0'
    }

    signingConfigs {
        release {
            if (signingProps['storeFile']) {
                storeFile = file(signingProps['storeFile'])
                storePassword = signingProps['storePassword']
                keyAlias = signingProps['keyAlias']
                keyPassword = signingProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signed with the release key when one is configured; otherwise with the debug key, so a fresh clone still builds.
            signingConfig = signingProps['storeFile'] ? signingConfigs.release : signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.1.0'
    implementation 'com.google.zxing:core:3.5.3'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
